<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>dropdown 下拉菜单 - Layui</title>
    <link rel="stylesheet" href="./assets/dist/css/layui.css" />
  </head>
  <body>
    <div class="lay-container lay-padding-3">
      <h2>常规</h2>
      <hr />

      <div style="display: flex; flex-direction: column; gap: 16px">
        <div>子菜单的展示方式：</div>
        <div>
          <button class="lay-btn" id="demo-submenu-popup">
            popup 模式 (默认)
            <i class="lay-icon lay-icon-down lay-font-12"></i>
          </button>
          <button class="lay-btn" id="demo-submenu-inline">
            inline 模式
            <i class="lay-icon lay-icon-down lay-font-12"></i>
          </button>
        </div>

        <div>禁用项和阻止关闭项：</div>
        <div>
          <button class="lay-btn lay-btn-primary" id="demo-item-disabled">
            下拉菜单
            <i class="lay-icon lay-icon-down lay-font-12"></i>
          </button>
        </div>

        <div>绑定任意目标元素：</div>
        <div class="lay-text">
          <a href="javascript:;" id="demo3">
            下拉菜单 <i class="lay-icon lay-icon-down"></i>
          </a>
        </div>
      </div>

      <br />
      <h2>右击</h2>
      <hr />

      <div
        class="lay-bg-gray"
        style="width: 100%; height: 160px; text-align: center"
        id="ID-dropdown-demo-contextmenu"
      >
        <span class="lay-font-gray" style="position: relative; top: 50%"
          >鼠标右键菜单</span
        >
      </div>
      <button class="lay-btn" style="margin-top: 15px" lay-on="contextmenu">
        开启全局右键菜单
      </button>

      <br /><br />
      <h2>重载</h2>
      <hr />
      <div
        class="lay-form"
        style="display: flex; flex-wrap: wrap; column-gap: 32px; row-gap: 11px"
      >
        <div>
          <button class="lay-btn" id="ID-dropdown-demo-reload">
            <span>完整重载</span>
            <i class="lay-icon lay-icon-down lay-font-12"></i>
          </button>
        </div>
        <div>
          <label>仅数据或内容重载：</label>
          <div class="lay-inline">
            <input
              type="text"
              autocomplete="off"
              placeholder="输入关键字"
              class="lay-input"
              id="ID-dropdown-demo-reloadData"
            />
          </div>
        </div>
      </div>
    </div>

    <script src="./assets/dist/layui.js"></script>
    <script>
      layui.use(() => {
        const { dropdown, layer, utils, $ } = layui;

        // 模拟数据
        const DEMO_DATA = [
          {
            title: 'link menu item 1',
            template() {
              return `
<div style="display: flex; align-items: center; gap: 8px;">
  <i class="lay-icon lay-icon-bot"></i>
  <span>${this.title}</span>
  <span class="lay-badge-dot"></span>
</div>
              `;
            },
            id: '',
            href: '',
          },
          {
            title: 'link menu item 2',
            template() {
              return `
<div style="display: flex; align-items: center; gap: 8px;">
  <img src="https://unpkg.com/outeres@0.1.1/demo/avatar/0.png" style="width: 20px;">
  <span>${this.title}</span>
</div>
              `;
            },
            id: '',
            href: 'https://example.com',
            target: '_blank',
          },
          { type: '-' },
          {},
          {
            title: 'menu item 3 <hello>',
            id: '',
            expanded: true,
            children: [
              {
                title: 'menu item 3-1',
                id: '',
              },
              {
                title: 'menu item 3-2',
                id: '',
                children: [
                  {
                    title: 'menu item 3-2-1',
                    id: '',
                  },
                  {
                    title: 'menu item 3-2-2',
                    id: '',
                    children: [
                      {
                        title: 'menu item 3-2-2-1',
                        id: '',
                      },
                      {
                        title: 'menu item 3-2-2-2',
                        id: '',
                      },
                    ],
                  },
                  {
                    title: 'menu item 3-2-3',
                    id: '',
                  },
                ],
              },
              {
                title: 'menu item 3-3',
                id: '',
                children: [
                  {
                    title: 'menu item 3-3-1',
                    id: '',
                  },
                  {
                    title: 'menu item 3-3-2',
                    id: '',
                    children: [
                      {
                        title: 'menu item 3-3-2-1',
                        id: '',
                      },
                      {
                        title: 'menu item 3-3-2-2',
                        id: '',
                      },
                      {
                        title: 'menu item 3-3-2-3',
                        id: '',
                      },
                    ],
                  },
                  {
                    title: 'menu item 3-3-3',
                    id: '',
                  },
                ],
              },
            ],
          },
          { type: '-' },
          {
            title: 'menu item 4',
            id: '',
          },
          {
            title: 'menu item 5',
            id: '',
            children: [
              {
                title: 'menu item 5-1',
                id: '',
                children: [
                  {
                    title: 'menu item 5-1-1',
                    id: '',
                  },
                  {
                    title: 'menu item 5-1-2',
                    id: '',
                  },
                  {
                    title: 'menu item 5-1-3',
                    id: '',
                  },
                ],
              },
              {
                title: 'menu item 5-2',
                id: '',
              },
              {
                title: 'menu item 5-3',
                id: '',
              },
            ],
          },
          {
            title: 'menu item 6',
            id: '',
            children: [
              {
                title: 'menu item 6-1',
                id: '',
              },
              {
                title: 'menu item 6-2',
                id: '',
              },
              {
                title: 'menu item 6-3',
                id: '',
              },
            ],
          },
        ];

        /**
         * 常规
         **/

        // 子菜单的展示方式通用 options
        const commonOptions = {
          data: DEMO_DATA,
          autoFitHeight: true,
          onClick({ data, ...$rest }) {
            console.log('click', data, $rest);
            layer.msg(`选择了 ${data.title}`);
          },
        };

        // popup 模式
        const dropdownInst = dropdown.render({
          ...commonOptions,
          elem: '#demo-submenu-popup',
        });
        // inline 模式
        dropdown.render({
          ...commonOptions,
          elem: '#demo-submenu-inline',
          submenuMode: 'inline',
        });

        console.dir(dropdown);
        console.log('dropdown.render() → ', dropdownInst);

        // 禁用项和阻止关闭项
        dropdown.render({
          elem: '#demo-item-disabled',
          backdrop: 0.03,
          // defaultOpen: true,
          closeOnClick: false,
          data: [
            {
              title: 'menu item 1',
              href: '#1',
              disabled: true,
            },
            {
              title: 'menu item 2（点击不关闭）',
              href: '#2',
              id: 'bbb',
            },
            {
              title: 'menu item 3',
              href: '#3',
            },
          ],
          onClick({ data, e }) {
            console.log(`click ${this.id}:`, data, e);
            if (data.id === 'bbb') {
              return false;
            }
          },
          afterOpen(...args) {
            console.log(`afterOpen ${this.id}`, args);
          },
          afterClose() {
            console.log(`afterClose ${this.id}`, this.$elem);
          },
        });

        // 绑定任意目标元素
        dropdown.render({
          elem: '#demo3',
          data: [
            {
              title: 'menu item 1',
            },
            {
              title: 'menu item 2',
            },
            {
              title: 'menu item 3',
            },
          ],
          placement: 'bottom',
          trigger: 'hover',
          afterClose() {
            console.log(`afterClose ${this.id}`, this.elem);
          },
        });

        // 右键
        dropdown.render({
          elem: '#ID-dropdown-demo-contextmenu', // 也可绑定到 document，从而重置整个右键
          trigger: 'contextmenu', //contextmenu
          style: 'width: 160px',
          data: [
            {
              title: 'menu item 1',
              id: '#1',
            },
            {
              title: 'menu item 2',
              id: 'reload',
            },
            { type: '-' },
            {
              title: 'menu item 3',
              id: '#3',
              children: [
                {
                  title: 'menu item 3-1',
                  id: '#1',
                },
                {
                  title: 'menu item 3-2',
                  id: '#2',
                },
                {
                  title: 'menu item 3-3',
                  id: '#3',
                },
              ],
            },
            { type: '-' },
            {
              title: 'menu item 4',
              id: '',
            },
            {
              title: 'menu item 5',
              id: '#1',
            },
            {
              title: 'menu item 6',
              id: '#1',
            },
          ],
          onClick({ data, e }) {
            if (data.id === 'reload') {
              location.reload();
            }
            console.log(`${this.id} → onClick → `, data);
          },
        });

        utils.on({
          // 改变触发右键菜单的目标元素
          contextmenu: (othis) => {
            var ID = 'ID-dropdown-demo-contextmenu';
            if (!othis.data('open')) {
              dropdown.reload(ID, {
                elem: document, // 设置全局元素右键
              });

              othis.html('取消全局右键菜单');
              othis.data('open', true);
            } else {
              dropdown.reload(ID, {
                elem: '#' + ID, // 设置局部元素右键
              });

              othis.html('开启全局右键菜单');
              othis.data('open', false);
            }
          },
        });

        // 完整重载
        dropdown.render({
          elem: '#ID-dropdown-demo-reload',
          data: [
            {
              title: 'menu item 1',
              id: 100,
            },
            {
              title: '重载该面板',
              id: 101,
            },
          ],
          onClick({ data, e }) {
            // 菜单项对应设置的 id 值
            if (data.id === 101) {
              // 重载方法
              dropdown.reload(this.id, {
                data: [
                  {
                    title: '新选项 1',
                    id: 111,
                  },
                  {
                    title: '新选项 2',
                    id: 222,
                  },
                ],
              });
              return false; // 点击该选项，阻止面板关闭
            }
          },
        });

        // 仅数据或内容重载
        const reloadDataInst = dropdown.render({
          elem: '#ID-dropdown-demo-reloadData',
          data: [
            { id: 1, title: 'Python' },
            { id: 2, title: 'JavaScript' },
            { id: 3, title: 'Java' },
            { id: 4, title: 'C++' },
            { id: 5, title: 'PHP' },
            { id: 6, title: 'Ruby' },
            { id: 7, title: 'Swift' },
            { id: 8, title: 'TypeScript' },
            { id: 9, title: 'Kotlin' },
            { id: 10, title: 'Go' },
          ],
          trigger: 'focus',
          style: 'min-width: 170px; box-shadow: 1px 1px 11px rgb(0 0 0 / 11%);',
          onClick({ data, e }) {
            console.log(data.title);
            this.$elem.val(data.title);
          },
        });
        const reloadDataInstId = reloadDataInst.options.id;
        const sourceData = reloadDataInst.options.data;

        // 输入框输入事件
        reloadDataInst.options.$elem.on('input', function () {
          const $this = $(this);
          const value = $this.val().trim();

          // 输入为空时，恢复初始渲染状态
          if (!value) {
            dropdown.reloadData(reloadDataInstId, {
              data: sourceData,
              template: null, // 恢复默认模板
            });
            return;
          }

          // 匹配到对应内容时，重载数据
          const dataNew = sourceData.filter(function (item) {
            const exp = new RegExp(value.split('').join('|'), 'i');
            return exp.test(item.title);
          });

          console.log(sourceData);
          dropdown.reloadData(reloadDataInstId, {
            data: dataNew, // 匹配到的新数据
            template(d) {
              const exp = new RegExp(value.split('').join('|'), 'gi');
              return d.title.replace(exp, function (str) {
                return '<span style="color: red;">' + str + '</span>';
              });
            },
          });
        });
      });
    </script>
  </body>
</html>
