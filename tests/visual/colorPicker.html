<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>colorPicker 颜色选择器 - Layui</title>

    <link rel="stylesheet" href="./assets/dist/css/layui.css" />

    <style>
      body {
        padding: 20px;
      }
      .test-box {
        margin-bottom: 50px;
      }
    </style>
  </head>
  <body>
    <div class="lay-container">
      <div class="test-box">
        <div class="lay-inline">
          <input class="lay-input" id="LAY-test1" />
        </div>
        <div id="test1"></div>
      </div>

      <div class="test-box">
        <div id="test2"></div>
      </div>

      <div class="test-box">
        <div id="test3"></div>
      </div>

      <div class="test-box">
        <div id="test4"></div>
      </div>

      <div class="test-box">
        <div id="test5"></div>
      </div>

      <div class="test-box">
        <div id="test6"></div>
      </div>

      <div class="test-box">
        <div class="test-more" data-lay-color="#ff0000"></div>
        <div class="test-more" data-lay-color="#008000"></div>
        <div class="test-more" data-lay-color="#0000ff"></div>
      </div>
    </div>

    <script src="./assets/dist/layui.js"></script>
    <script>
      layui.use(() => {
        const { colorPicker } = layui;

        const colorPickerInst = colorPicker.render({
          elem: '#test1',
          // predefine: true, // 开启预定义颜色
          // colors: ['#F00','#0F0','#00F','rgb(255, 69, 0)','rgba(255, 69, 0, 0.5)'],
          onChange({ color }) {
            this.done({ color });
          },
          done({ color }) {
            layui.$('#LAY-test1').val(color);
            document.body.style.backgroundColor = color;
          },
          afterClose(params) {
            console.log(`${params.options.id} → afterClose → `, params);
          },
        });

        console.dir(colorPicker);
        console.log(colorPickerInst);

        colorPicker.render({
          elem: '#test2',
          color: 'rgba(218, 121, 157, 1)',
          predefine: true,
          alpha: true,
          format: 'rgb',
          onChange: ({ color }) => {
            console.log(color);
          },
        });

        colorPicker.render({
          elem: '#test3',
          color: '#000',
          // alpha: true,
          // format: 'rgb',
        });

        colorPicker.render({
          elem: '#test4',
          color: '#06eeb8',
          predefine: true,
          format: 'rgb',
        });

        colorPicker.render({
          elem: '#test5',
          color: '#ffd900',
          predefine: true,
          size: 'lg',
        });

        colorPicker.render({
          elem: '#test6',
          color: '#F00',
          predefine: true,
          colors: [
            '#F00',
            '#0F0',
            '#00F',
            'rgb(255, 69, 0)',
            'rgba(255, 69, 0, 0.5)',
          ],
          size: 'xs',
        });

        // 同时绑定多个
        colorPicker.render({
          elem: '.test-more',
          done: function ({ color }) {
            console.log(this.elem, color);
          },
        });
      });
    </script>
  </body>
</html>
