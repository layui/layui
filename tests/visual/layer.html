<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>layer 全局弹出层 - Layui</title>
    <link rel="stylesheet" href="./assets/dist/css/layui.css" />
    <link rel="stylesheet" href="./assets/demo.css" />
    <style>
      body {
        padding: 100px;
      }
      #demo-photos li {
        float: left;
        margin: 0 1px 1px;
      }
      #demo-photos img {
        max-height: 38px;
      }
    </style>
  </head>
  <body>
    <div class="lay-btn-container">
      <button class="lay-btn lay-btn-primary" lay-on="alert">Alert</button>
      <button class="lay-btn" lay-on="confirm">Confirm</button>
      <button class="lay-btn" lay-on="msg">Msg</button>
      <button class="lay-btn" lay-on="page">Page</button>
      <button class="lay-btn" lay-on="iframe">Iframe</button>
      <button class="lay-btn" lay-on="loading">Loading</button>
      <button class="lay-btn" lay-on="tips">Tips</button>
      <button class="lay-btn" lay-on="prompt">Prompt</button>
      <button class="lay-btn" lay-on="tab">Tab</button>
      <button class="lay-btn" lay-on="photos">Photo</button>
      <button class="lay-btn" lay-on="drawer">Drawer</button>
      <button class="lay-btn" lay-on="autoClose">自动关闭</button>
      <a href="https://layui.dev/docs/2/layer/" target="_blank" class="lay-btn"
        >更多例子</a
      >
    </div>

    <div id="demo-content" style="display: none; padding: 16px">
      content 指向放置在页面的一段隐藏元素
    </div>

    <hr />
    <br />

    <div class="lay-list">
      <ul class="lay-row" id="demo-photos">
        <li class="list">
          <img src="https://unpkg.com/outeres/demo/1.jpg" alt="123" />
        </li>
        <li class="list"><img src="https://unpkg.com/outeres/demo/2.jpg" /></li>
      </ul>
    </div>

    <script>
      var LAYUI_GLOBAL = {
        // path: '../src/',
        // layerPath: '../release/layer/src/'
      };
    </script>

    <script src="./assets/dist/layui.js"></script>

    <!-- layer 独立版调试 -->
    <script
      src1="//cdnjs.cloudflare.com/ajax/libs/jquery/1.12.3/jquery.min.js"
    ></script>
    <script src1="../release/layer/src/layer.js"></script>

    <script>
      var runTest = (run, $, layer) => {
        if (!run) return;

        var timer = setInterval(() => {
          //location.reload();
        }, 1000);

        layer.alert(123);

        $.ajax({
          url: './all.html',
          beforeSend: () => {
            //layer.ready(function(){
            //layer.load();
            //});
          },
          success: () => {
            return;
            layer.closeAll('loading', () => {
              setTimeout(() => {
                if ($('.lay-layer-loading').length) {
                  console.error('layer close 异常');
                  clearInterval(timer);
                }
              }, 200);
            });
          },
        });
      };
      window.jQuery && runTest(1, window.jQuery, window.layer);

      layui.use(() => {
        var $ = layui.$;
        var lay = layui.lay;
        var layer = layui.layer;
        var utils = layui.utils;
        // return

        var index = layer.msg('Hello World');
        //layer.close(index);
        //runTest(1, $, layer);

        // 触发事件
        utils.on('lay-on', {
          alert: () => {
            var icon = -1;
            (function changeIcon() {
              var index = layer.alert(
                'Hi，你好！ 点击确认更换图标',
                {
                  icon: icon,
                  shadeClose: true,
                  title: icon === -1 ? 'Alert' : 'icon: ' + icon,
                },
                changeIcon,
              );
              if (icon++ > 6) {
                layer.close(index);
                icon = -1;
              }
            })();
          },
          confirm: () => {
            layer.confirm(
              '一个询问层的测试示例？',
              {
                btn: ['确定', '关闭'], //按钮
              },
              () => {
                layer.msg('第一个回调', { icon: 1 });
              },
              () => {
                layer.msg('第二个回调', {
                  time: 20000, //20s后自动关闭
                  btn: ['明白了', '知道了'],
                });
              },
            );
          },
          msg: () => {
            !0
              ? layer.msg('一个常用消息框')
              : layer.msg('一个常用消息框', { closeBtn: 0, time: 0, icon: 16 });
          },
          tips: function () {
            layer.tips('Hi，我是一个小提示', this, { tips: 1 });
          },
          page: () => {
            layer.open({
              title: '自定义页面层',
              type: 1,
              skin: 'lay-layer-border',
              area: ['1000px', '580px'],
              content: $('#demo-content'),
              maxmin: true,
              shade: false,
              minStack: false, // 最小化不堆叠在左下角
              id: 'page-1', // 定义 ID，防止重复弹出
              min: (layero, index) => {
                layer.msg('阻止了默认的最小化');
                layer.style(index, { top: 'auto', bottom: 0 });
                return false;
              },
            });
          },
          iframe: () => {
            layer.open({
              type: 2,
              content: 'https://www.aliyun.com/activity?userCode=ap0255is',
              area: ['375px', '500px'],
              id: 'iframe-1',
              hideOnClose: true, // 关闭时是否隐藏弹层容器，下次打开时直接显示原来的弹层
              maxmin: true,
            });
          },
          loading: () => {
            layer.load(0, {
              time: 5 * 1000,
              //content: '123'
            });
          },
          prompt: () => {
            layer.prompt(
              { title: '输入任何口令，并确认', formType: 1 },
              (pass, index) => {
                layer.close(index);
                layer.prompt(
                  { title: '随便写点啥，并确认', formType: 2 },
                  (text, index) => {
                    layer.close(index);
                    layer.msg(
                      '演示完毕！您的口令：' +
                        lay.escape(pass) +
                        '<br>您最后写下了：' +
                        lay.escape(text),
                    );
                  },
                );
              },
            );
          },
          tab: () => {
            layer.tab({
              area: ['600px', '300px'],
              tab: [
                {
                  title: 'TAB1',
                  content: '内容1',
                },
                {
                  title: 'TAB2',
                  content: '内容2',
                },
                {
                  title: 'TAB3',
                  content: '内容3',
                },
              ],
            });
          },
          photos: () => {
            layer.photos({
              photos: {
                data: [
                  {
                    src: 'https://unpkg.com/outeres/demo/layer.png',
                  },
                ],
              },
              hideFooter: true, // 是否隐藏图片底部栏（v2.8.0 新增）
            });
          },
          autoClose: () => {
            layer.alert('你好么，体验者。<br>在标题栏显示自动关闭倒计秒数', {
              time: 5 * 1000,
              success: function (layero, index) {
                var timeNum = this.time / 1000,
                  setText = (start) => {
                    layer.title(
                      (start ? timeNum : --timeNum) + ' 秒后关闭',
                      index,
                    );
                  };
                setText(!0);
                this.timer = setInterval(setText, 1000);
                if (timeNum <= 0) clearInterval(this.timer);
              },
              end: function () {
                clearInterval(this.timer);
              },
            });
          },
          drawer: () => {
            layer.open({
              title: 'drawer',
              type: 1,
              offset: 'b',
              anim: 'slideUp', // 从下往上
              area: ['100%', '160px'],
              shade: 0.1,
              shadeClose: true,
              content: $('#demo-content'),
              maxmin: true,
            });
          },
        });

        // 相册层
        layer.photos({
          photos: '#demo-photos', // $('#demo-photos')
          // toolbar: false,
          // footer: false
        });

        //动态追加
        $('#demo-photos').append(
          '<li class="list"><img src="https://unpkg.com/outeres/demo/3.jpg"></li>',
        );
      });
    </script>
  </body>
</html>
