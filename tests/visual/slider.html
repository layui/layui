<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>slider 滑块 - Layui</title>
    <link rel="stylesheet" href="./assets/dist/css/layui.css" />
    <link rel="stylesheet" href="./assets/demo.css" />
  </head>
  <body>
    <div class="lay-container lay-padding-5">
      <h2>水平滑块</h2>
      <div class="lay-flex-col" style="padding-block: 32px">
        <div id="demo-normal"></div>
      </div>

      <h2>垂直滑块</h2>
      <div class="lay-flex-col" style="padding-block: 32px">
        <div id="demo-vertical"></div>
      </div>
    </div>

    <script src="./assets/dist/layui.js"></script>
    <script>
      layui.use(() => {
        const { slider } = layui;

        // 水平滑块
        const sliderInst = slider.render({
          elem: '#demo-normal',
          tips: true,
          tipsAlways: true,
          input: true,
          onChange({ options, value }) {
            console.log(`${options.id} → onChange →`, value);
          },
          done({ options, value }) {
            console.log(`${options.id} → done →`, value);
          },
          setTips: ({ value }) => `${value}%`,
        });

        console.dir(slider);
        console.log(sliderInst);
        // sliderInst.setValue(30);

        // 垂直滑块
        slider.render({
          elem: '#demo-vertical',
          type: 'vertical',
        });
      });
    </script>
  </body>
</html>
