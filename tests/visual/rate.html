<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rate 评分 - Layui</title>
    <link rel="stylesheet" href="./assets/dist/css/layui.css" />
    <link rel="stylesheet" href="./assets/demo.css" />
  </head>
  <body>
    <div class="lay-container lay-padding-3">
      <h2>基础用法</h2>
      <div class="lay-flex-col">
        <div id="demo-normal"></div>
      </div>

      <h2>选中半星</h2>
      <div class="lay-flex-col">
        <div id="demo-half"></div>
      </div>

      <h2>显示文本</h2>
      <div class="lay-flex-col">
        <div id="demo-text"></div>
      </div>

      <h2>设置只读</h2>
      <div class="lay-flex-col">
        <div id="demo-readonly"></div>
      </div>
    </div>

    <script src="./assets/dist/layui.js"></script>
    <script>
      layui.use(() => {
        const { rate, layer } = layui;

        // 基础用法
        const rateInst = rate.render({
          elem: '#demo-normal',
          length: 5,
          value: 5,
          text: true,
          setText(value) {
            // 设置自定义文本
            const obj = {
              1: '极差',
              2: '差',
              3: '一般',
              4: '满意',
              5: '极满意',
            };
            return obj[value] || value;
          },
        });

        console.dir(rate);
        console.log(rateInst);
        // rateInst.setValue(3);

        // 选中半星
        rate.render({
          elem: '#demo-half',
          length: 6,
          value: 2,
          half: true,
          theme: '#5FB878',
          choose(value) {
            if (value > 3) {
              layer.tips('超过 3 星', this.elem);
            }
          },
        });

        // 显示文本
        rate.render({
          elem: '#demo-text',
          length: 3,
          value: 2.8,
          text: true,
          half: true,
          theme: '#FF5722',
        });

        // 设置只读
        rate.render({
          elem: '#demo-readonly',
          value: 3.5,
          half: true,
          readonly: true,
        });
      });
    </script>
  </body>
</html>
