<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>carousel 轮播 - Layui</title>
    <link rel="stylesheet" href="./assets/dist/css/layui.css" />
    <link rel="stylesheet" href="./assets/demo.css" />
    <style>
      /* 仅为了区分演示效果 */
      div[carousel-item] > * {
        text-align: center;
        line-height: 280px;
        color: #fff;
      }
      div[carousel-item] > *:nth-child(2n) {
        background-color: #009688;
      }
      div[carousel-item] > *:nth-child(2n + 1) {
        background-color: #5fb878;
      }

      #demo-fade div[carousel-item] > * {
        line-height: 120px;
      }
    </style>
  </head>
  <body>
    <div class="lay-padding-3">
      <h2>常规示例</h2>
      <div class="lay-flex-col">
        <div class="lay-carousel" id="demo-normal" lay-filter="demo-normal">
          <div carousel-item>
            <div>条目1</div>
            <div>条目2</div>
            <div>条目3</div>
            <div>条目4</div>
          </div>
        </div>
      </div>

      <h2>fade 动画</h2>
      <div class="lay-flex-col">
        <div class="lay-carousel" id="demo-fade">
          <div carousel-item>
            <div>条目1</div>
            <div>条目2</div>
          </div>
        </div>
      </div>

      <h2>updown 动画</h2>
      <div class="lay-flex-col">
        <div class="lay-carousel" id="demo-updown">
          <div carousel-item>
            <div>条目1</div>
            <div>条目2</div>
            <div>条目3</div>
            <div>条目4</div>
          </div>
        </div>
      </div>

      <h2>图片轮播</h2>
      <div class="lay-flex-col">
        <div class="lay-carousel" id="demo-picture">
          <div carousel-item>
            <div>
              <img
                src="https://unpkg.com/outeres/demo/carousel/720x360-1.jpg"
              />
            </div>
            <div>
              <img
                src="https://unpkg.com/outeres/demo/carousel/720x360-2.jpg"
              />
            </div>
            <div>
              <img
                src="https://unpkg.com/outeres/demo/carousel/720x360-3.jpg"
              />
            </div>
            <div>
              <img
                src="https://unpkg.com/outeres/demo/carousel/720x360-4.jpg"
              />
            </div>
            <div>
              <img
                src="https://unpkg.com/outeres/demo/carousel/720x360-5.jpg"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./assets/dist/layui.js"></script>
    <script>
      layui.use(() => {
        var carousel = layui.carousel;

        // 常规示例
        var carInst = carousel.render({
          elem: '#demo-normal',
          index: 2,
          // full: true,
          arrow: 'always',
          autoplay: 'always',
          change: (obj) => {
            // console.log(obj);
          },
          // interval: 5000,
          // autoplay: false,
          // indicator: 'outside',
          // trigger: 'hover'
        });

        console.dir(carousel);
        console.log(carInst);
        // carInst.goto(1);

        // fade 动画
        carousel.render({
          elem: '#demo-fade',
          interval: 1800,
          // full: true,
          anim: 'fade',
          height: '120px',
        });

        // updown 动画
        carousel.render({
          elem: '#demo-updown',
          // full: true,
          arrow: 'always',
          // autoplay: false,
          // indicator: 'outside',
          // trigger: 'hover',
          anim: 'updown',
          // full: true
        });

        // 图片轮播
        carousel.render({
          elem: '#demo-picture',
          width: '720px',
          height: '360px',
          interval: 5000,
        });
      });
    </script>
  </body>
</html>
