<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>transfer 穿梭框 - Layui</title>

    <link rel="stylesheet" href="./assets/dist/css/layui.css" />
    <link rel="stylesheet" href="./assets/demo.css" />
  </head>
  <body>
    <div class="lay-container lay-padding-3">
      <h2>常规示例</h2>
      <div class="lay-flex-col">
        <div class="lay-btn-container">
          <button type="button" class="lay-btn" lay-on="getData">
            获取右侧数据
          </button>
          <button type="button" class="lay-btn" lay-on="reload">
            重载实例
          </button>
        </div>

        <div id="demo-normal"></div>
      </div>

      <h2>解析数据</h2>
      <div class="lay-flex-col">
        <div id="demo-parse-data"></div>
      </div>
    </div>

    <script src="./assets/dist/layui.js"></script>
    <script type="module">
      const { $, transfer, utils } = layui;

      // 常规示例
      const transferInst = transfer.render({
        elem: '#demo-normal',
        title: ['候选文人', '获奖文人'],
        data: [
          { value: '1', title: '李白' },
          { value: '2', title: '杜甫' },
          { value: '3', title: '贤心' },
          { value: '11', title: '鲁迅', disabled: true },
          { value: '15', title: '巴金' },
          { value: '16', title: '冰心' },
          { value: '6', title: '冰心' },
          { value: '6', title: '冰心' },
          { value: '6', title: '冰心' },
          { value: '6', title: '冰心' },
          { value: '6', title: '冰心' },
          { value: '6', title: 'Bbb' },
          { value: '6', title: 'BB' },
          { value: '6', title: 'Aa' },
          { value: '6', title: 'aa' },
        ],
        id: 'demoId',
        value: ['1', '15', '16'],
        showSearch: true, // 若区分大小写，设置 'cs'
      });

      console.dir(transfer);
      console.log(transferInst);

      // 按钮事件
      utils.on({
        getData() {
          alert(JSON.stringify(transferInst.getData()));
        },
        reload() {
          transfer.reload('demoId', {
            value: ['6'],
            // data: [{"value": "1", "title": "李白"}]
          });
        },
      });

      // 解析数据
      transfer.render({
        elem: '#demo-parse-data',
        showSearch: true,
        onChange: (params) => {
          console.log(params);
        },
        parseData: (res) => ({
          value: res.id,
          title: res.label,
          disabled: res.disabled,
          checked: res.checked,
        }),
        data: [
          { id: '1', label: '瓦罐汤' },
          { id: '2', label: '油酥饼' },
          { id: '3', label: '炸酱面' },
          { id: '4', label: '串串香', disabled: true },
          { id: '5', label: '豆腐脑' },
          { id: '6', label: '驴打滚' },
        ],
        value: ['1', '5'],
      });
    </script>
  </body>
</html>
