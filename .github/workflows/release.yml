name: Release

on:
  push:
    tags:
      - 'v*'

# 串行发布
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      # 校验 tag 与 package.json 版本一致，避免产物目录与上传路径不匹配
      - name: Verify Version Consistency
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION 与 package.json 版本 $PKG_VERSION 不一致"
            exit 1
          fi

      # 构建产物
      - name: Build
        run: npm run build

      # 获取当前版本贡献者
      - name: Fetch Contributors
        id: contributors
        run: |
          USERNAME_LIST=""

          # 获取完整的提交历史
          git fetch --prune --unshallow

          # 按日期排序标签，获取上一个标签
          PREVIOUS_TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | sed -n 2p)

          # 获取当前标签
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          echo "Previous Tag: $PREVIOUS_TAG"
          echo "Current Tag: $CURRENT_TAG"

          for COMMIT_SHA in $(git log ${PREVIOUS_TAG}...$CURRENT_TAG --pretty=format:"%H")
          do
            USER=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                   https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/$COMMIT_SHA \
                   | jq -r '.author.login')
            if [ "$USER" != "null" ] && [ ! -z "$USER" ]; then
              USERNAME_LIST="$USERNAME_LIST @$USER"
            fi
          done
          USERNAME_LIST=$(echo $USERNAME_LIST | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "usernames=$USERNAME_LIST" >> $GITHUB_OUTPUT

      - name: Determine Prerelease
        id: prerelease
        run: |
          if [[ ${{ github.ref }} =~ - ]]; then
            echo "Setting prerelease to true"
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "Setting prerelease to false"
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

          # 预发布版本发布到同名 dist-tag（alpha/beta/rc），避免抢占 latest
          NPM_DIST_TAG=$(node -p "const v = require('./package.json').version; v.includes('-') ? (v.match(/-([a-z][a-z0-9]*)/i)?.[1] ?? 'next') : 'latest'")
          echo "NPM_DIST_TAG=$NPM_DIST_TAG" >> $GITHUB_ENV

      - name: Create Zip File
        id: asset
        run: |
          npm run release
          DIR_NAME="release/assets/layui-${{ env.VERSION }}"
          echo "filename=$DIR_NAME" >> $GITHUB_OUTPUT

      # 创建 GitHub Release
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            - **更新日志**: https://layui.dev/docs/3/versions.html#${{ env.VERSION }}
            - **本次贡献**: ${{ steps.contributors.outputs.usernames }} 🎉
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          files: ${{ steps.asset.outputs.filename }}.zip

      # 发布到 NPM
      - name: Publish to NPM
        run: npm publish --ignore-scripts --tag ${{ env.NPM_DIST_TAG }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
