<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XSS 安全测试用例 - layui</title>
    <link rel="stylesheet" href="../../src/css/layui.css" />
    <style>
      :root {
        --sec-border: #e8eaed;
        --sec-muted: #767b83;
        --sec-pass: #16b777;
        --sec-fail: #ff5722;
      }

      body {
        background: #f7f8fa;
      }

      /* 侧边导航 */
      .sec-side {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        width: 236px;
        background: #fff;
        border-right: 1px solid var(--sec-border);
      }

      .sec-side-head {
        padding: 18px 20px 14px;
        border-bottom: 1px solid var(--sec-border);
      }

      .sec-side-title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }

      .sec-side-path {
        margin: 4px 0 0;
        color: var(--sec-muted);
        font-size: 12px;
        font-family: Consolas, Monaco, monospace;
      }

      .sec-side-nav {
        flex: 1 1 auto;
        min-height: 0;
        padding: 8px 0;
        overflow-y: auto;
      }

      .sec-nav-group {
        padding: 10px 20px 6px;
        color: #a6abb4;
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .sec-nav-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 20px;
        color: #3c4049;
        font-size: 13px;
        cursor: pointer;
        border-left: 2px solid transparent;
        transition: background 0.15s;
      }

      .sec-nav-item:hover {
        background: #f7f8fa;
      }

      .sec-nav-item.is-active {
        color: #1677ff;
        border-left-color: #1677ff;
        background: #f0f6ff;
      }

      .sec-nav-item .layui-icon {
        color: #9aa0aa;
        font-size: 14px;
      }

      .sec-nav-item.is-active .layui-icon {
        color: #1677ff;
      }

      .sec-nav-text {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sec-nav-count {
        flex: none;
        min-width: 34px;
        padding: 0 6px;
        border-radius: 2px;
        color: var(--sec-muted);
        font-size: 11px;
        line-height: 16px;
        text-align: center;
        background: #f2f3f5;
      }

      .sec-nav-count.is-pass {
        color: #0f8a5f;
        background: #e8f7f0;
      }

      .sec-nav-count.is-fail {
        color: #d7490a;
        background: #ffece4;
      }

      .sec-side-foot {
        padding: 12px 16px;
        border-top: 1px solid var(--sec-border);
      }

      /* 主区域 */
      .sec-main {
        margin-left: 236px;
        padding: 16px;
      }

      .sec-hero {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        padding: 18px 20px;
        border: 1px solid var(--sec-border);
        border-radius: 2px;
        background: #fff;
      }

      .sec-hero h1 {
        margin: 0;
        font-size: 19px;
      }

      .sec-hero p {
        margin: 6px 0 0;
        max-width: 720px;
        color: var(--sec-muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .sec-hero p code {
        margin: 0 2px;
        padding: 1px 5px;
        border: 1px solid var(--sec-border);
        border-radius: 2px;
        color: #c7254e;
        font-size: 12px;
        background: #fafbfc;
      }

      .sec-progress {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: center;
        margin: 16px 0 8px;
        padding: 14px 20px;
        border: 1px solid var(--sec-border);
        border-radius: 2px;
        background: #fff;
      }

      .sec-progress-bar {
        flex: 1 1 220px;
        height: 6px;
        overflow: hidden;
        border-radius: 2px;
        background: #eef0f3;
      }

      .sec-progress-bar > i {
        display: block;
        width: 0;
        height: 100%;
        background: var(--sec-pass);
        transition: width 0.3s;
      }

      .sec-progress-bar.is-fail > i {
        background: var(--sec-fail);
      }

      .sec-stat {
        display: flex;
        gap: 18px;
        font-size: 12px;
        color: var(--sec-muted);
      }

      .sec-stat b {
        display: block;
        color: #23262b;
        font-size: 17px;
        line-height: 1.2;
      }

      .sec-stat .is-pass b {
        color: var(--sec-pass);
      }

      .sec-stat .is-fail b {
        color: var(--sec-fail);
      }

      .sec-stat-extra {
        display: block;
        color: #b26a00;
        font-size: 11px;
        font-style: normal;
        line-height: 1.4;
      }

      .sec-stat-extra:empty {
        display: none;
      }

      /* 运行结果状态条：代替临时 toast，避免遮挡内容且可回看 */
      .sec-run-status {
        margin: 0;
        flex: 1 1 100%;
        min-height: 18px;
        color: #5a6069;
        font-size: 12px;
        line-height: 18px;
      }

      .sec-run-status:empty {
        display: none;
      }

      .sec-run-status.is-fail {
        color: #b4340b;
      }

      .sec-hero-hint {
        margin: 10px 0 0;
        padding: 8px 12px;
        max-width: 760px;
        border-left: 2px solid #1677ff;
        color: #5a6069;
        font-size: 12px;
        line-height: 1.7;
        background: #f5f9ff;
      }

      /*
       * 待运行用例浮层样式
       */

      /*
       * 以 fixed 浮层挂在侧栏右侧（脚本按侧栏与按钮位置定位）：
       * 不参与文档流，展开/收起不改变页面高度，因而不会触发滚动锚定导致视口跳动，
       * 也不会挤压、遮挡侧栏的 nav 列表
       */
      .sec-pending {
        position: fixed;
        z-index: 200;
        display: flex;
        flex-direction: column;
        width: 460px;
        max-width: calc(100vw - 32px);
        max-height: min(66vh, 520px);
        overflow: hidden;
        border: 1px solid var(--sec-border);
        border-radius: 2px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
        animation: sec-pending-in 0.16s ease-out;
      }

      .sec-pending[hidden] {
        display: none;
      }

      @keyframes sec-pending-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sec-pending {
          animation: none;
        }
      }

      .sec-pending-head {
        display: flex;
        flex: none;
        gap: 12px;
        align-items: flex-start;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--sec-border);
      }

      .sec-pending-title {
        margin: 0;
        font-size: 14px;
      }

      .sec-pending-desc {
        margin: 4px 0 0;
        color: var(--sec-muted);
        font-size: 12px;
        line-height: 1.7;
      }

      .sec-pending-close {
        flex: none;
      }

      .sec-pending-list {
        flex: 1;
        min-height: 0;
        margin: 0;
        padding: 6px 0;
        overflow: auto;
        list-style: none;
        overscroll-behavior: contain;
      }

      .sec-pending-item {
        display: flex;
        width: 100%;
        gap: 10px;
        align-items: center;
        padding: 6px 16px;
        border: 0;
        border-left: 2px solid transparent;
        color: #3c4049;
        font-size: 13px;
        line-height: 1.6;
        text-align: left;
        background: none;
        cursor: pointer;
        transition: background 0.15s;
      }

      .sec-pending-item:hover,
      .sec-pending-item:focus-visible {
        color: #1677ff;
        background: #f5f9ff;
        border-left-color: #1677ff;
        outline: none;
      }

      .sec-pending-item-module {
        flex: none;
        width: 104px;
        overflow: hidden;
        color: var(--sec-muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sec-pending-item-case {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .sec-pending-flag {
        flex: none;
        padding: 0 6px;
        border-radius: 2px;
        font-size: 11px;
        font-style: normal;
        line-height: 16px;
      }

      .sec-pending-flag.is-manual {
        border: 1px solid #ffe0b2;
        color: #b26a00;
        background: #fff7e6;
      }

      .sec-pending-flag.is-auto {
        color: var(--sec-muted);
        background: #f2f3f5;
      }

      .sec-pending-empty {
        margin: 0;
        padding: 14px 16px;
        color: var(--sec-muted);
        font-size: 12px;
      }

      .sec-side-foot {
        padding: 12px 16px;
        border-top: 1px solid var(--sec-border);
      }

      /* 模块 */
      .sec-module {
        margin-top: 22px;
        scroll-margin-top: 16px;
      }

      .sec-module-head {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: baseline;
        justify-content: space-between;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--sec-border);
      }

      .sec-module-title {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 0;
        font-size: 16px;
      }

      .sec-module-title .layui-icon {
        color: #1677ff;
      }

      .sec-module-body {
        margin: 10px 0 0;
        color: var(--sec-muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .sec-module-body code,
      .sec-case-anchors code {
        margin: 0 2px;
        padding: 1px 5px;
        border: 1px solid var(--sec-border);
        border-radius: 2px;
        color: #c7254e;
        font-size: 12px;
        background: #fafbfc;
      }

      .sec-cases {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 14px;
        margin-top: 12px;
      }

      /* 横向布局的组件（如 transfer）需要更宽的卡片，避免面板被压缩 */
      .sec-cases.is-roomy {
        grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
      }

      /* 节点/链接较多的用例横跨整行，避免内容被压缩 */
      .sec-case.is-wide {
        grid-column: 1 / -1;
      }

      .sec-case.is-wide .layui-tree {
        max-height: 280px;
      }

      /* 用例卡片 */
      .sec-case {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--sec-border);
        border-radius: 2px;
        background: #fff;
      }

      .sec-case[data-state='pass'] {
        border-color: #bfe5d5;
      }

      .sec-case[data-state='fail'] {
        border-color: #ffcbb8;
      }

      .sec-case-head {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 12px 14px;
        border-bottom: 1px solid var(--sec-border);
      }

      .sec-case-title {
        flex: 1;
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.5;
      }

      .sec-case-idx {
        display: inline-block;
        min-width: 18px;
        margin-right: 4px;
        color: #9aa0aa;
        font-weight: 400;
      }

      .sec-case-state {
        flex: none;
        padding: 0 8px;
        border-radius: 2px;
        color: var(--sec-muted);
        font-size: 12px;
        line-height: 18px;
        background: #f2f3f5;
        white-space: nowrap;
      }

      .sec-case[data-state='pass'] .sec-case-state {
        color: #0f8a5f;
        background: #e8f7f0;
      }

      .sec-case[data-state='fail'] .sec-case-state {
        color: #d7490a;
        background: #ffece4;
      }

      .sec-case[data-state='pending'].is-manual .sec-case-state {
        color: #b26a00;
        background: #fff7e6;
      }

      /* 未执行时状态徽标已写明「待手工」，无需重复展示标签 */
      .sec-case[data-state='pending'] .sec-case-tag {
        display: none;
      }

      .sec-case-tag {
        flex: none;
        padding: 0 6px;
        border: 1px solid #ffe0b2;
        border-radius: 2px;
        color: #b26a00;
        font-size: 11px;
        line-height: 16px;
        background: #fff7e6;
      }

      /* 从待运行列表跳转过来时的高亮，便于确认定位目标 */
      @keyframes sec-case-flash {
        0% {
          box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.45);
        }
        100% {
          box-shadow: 0 0 0 3px rgba(22, 119, 255, 0);
        }
      }

      .sec-case.is-flash {
        animation: sec-case-flash 1.6s ease-out;
      }

      @media (prefers-reduced-motion: reduce) {
        .sec-case.is-flash {
          animation: none;
          outline: 2px solid #1677ff;
          outline-offset: 1px;
        }
      }

      .sec-case-anchors {
        margin: 0;
        padding: 8px 14px;
        color: var(--sec-muted);
        font-size: 12px;
        line-height: 1.8;
        background: #fafbfc;
        border-bottom: 1px solid var(--sec-border);
        overflow-wrap: anywhere;
      }

      .sec-case-body {
        flex: 1;
        padding: 12px 14px;
      }

      .sec-case-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 14px 12px;
      }

      .sec-case-actions:empty {
        display: none;
      }

      .sec-case-detail {
        border-top: 1px dashed var(--sec-border);
        background: #fbfcfd;
        font-size: 12px;
      }

      .sec-case-detail[hidden] {
        display: none;
      }

      .sec-detail-head {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 7px 14px;
        color: #5a6069;
        background: #f6f7f9;
        border-bottom: 1px solid var(--sec-border);
      }

      .sec-detail-head > .layui-icon {
        flex: none;
        color: #9aa0aa;
        font-size: 13px;
      }

      .sec-case[data-state='pass'] .sec-detail-head > .layui-icon {
        color: var(--sec-pass);
      }

      .sec-case[data-state='fail'] .sec-detail-head > .layui-icon {
        color: var(--sec-fail);
      }

      .sec-detail-title {
        flex: 1;
        font-weight: 600;
        letter-spacing: 0.2px;
      }

      .sec-detail-badge {
        flex: none;
        padding: 0 6px;
        border-radius: 2px;
        color: #0f8a5f;
        font-size: 11px;
        font-style: normal;
        line-height: 16px;
        background: #e8f7f0;
      }

      .sec-detail-badge.is-fail {
        color: #d7490a;
        background: #ffece4;
      }

      .sec-asserts {
        max-height: 264px;
        margin: 0;
        padding: 6px 0;
        overflow: auto;
        list-style: none;
      }

      .sec-asserts li {
        display: flex;
        gap: 7px;
        padding: 3px 14px;
        color: #6b7280;
        line-height: 1.65;
        overflow-wrap: anywhere;
      }

      .sec-asserts li > .layui-icon {
        flex: none;
        margin-top: 3px;
        color: #b9bec6;
        font-size: 12px;
      }

      .sec-asserts li.is-pass > .layui-icon {
        color: var(--sec-pass);
      }

      .sec-asserts li.is-fail {
        color: #b4340b;
        background: #fff5f0;
        box-shadow: inset 2px 0 0 var(--sec-fail);
      }

      .sec-asserts li.is-fail > .layui-icon {
        color: var(--sec-fail);
      }

      .sec-fixture {
        padding: 10px;
        border: 1px dashed var(--sec-border);
        border-radius: 2px;
        background: #fcfcfd;
        overflow-wrap: anywhere;
      }

      .sec-fixture + .sec-fixture {
        margin-top: 10px;
      }

      .sec-fixture .layui-table-view {
        margin: 0;
      }

      .sec-fixture .layui-tree {
        max-height: 220px;
        padding: 0;
        overflow: auto;
      }

      .sec-fixture .layui-transfer-box {
        min-width: 0;
      }

      /* 横向组件在宽卡片内居中，避免右侧留白失衡 */
      .sec-fixture .layui-transfer {
        width: max-content;
        max-width: 100%;
        margin: 0 auto;
      }

      /* 长载荷在夹具内换行，避免横向滚动影响阅读；不改变组件本身的断言 */
      .sec-fixture .layui-transfer-data li {
        display: flex;
        align-items: center;
        height: auto;
        min-height: 32px;
        padding: 4px 10px;
        line-height: normal;
      }

      .sec-fixture .layui-form-checkbox {
        height: auto;
        min-height: 20px;
      }

      .sec-fixture .layui-form-checkbox > div {
        white-space: normal;
        overflow-wrap: anywhere;
        line-height: 20px;
      }

      .sec-fixture-muted {
        color: #a6abb4;
        font-size: 12px;
      }

      @media (max-width: 1200px) {
        .sec-cases {
          grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }

        /* 窄屏下横向组件独占一行，保证面板完整可见 */
        .sec-cases.is-roomy {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 960px) {
        .sec-side {
          width: 190px;
        }

        .sec-main {
          margin-left: 190px;
          padding: 16px;
        }

        .sec-pending {
          left: 190px;
          width: 360px;
          max-width: calc(100vw - 190px);
        }
      }

      @media (max-width: 720px) {
        .sec-side {
          position: sticky;
          top: 0;
          z-index: 150;
          flex-wrap: wrap;
          flex-direction: row;
          width: auto;
          height: auto;
          background: #fff;
          border-right: 0;
          border-bottom: 1px solid var(--sec-border);
        }

        .sec-side-head {
          display: none;
        }

        .sec-side-nav {
          display: flex;
          flex: 1 0 100%;
          gap: 4px;
          box-sizing: border-box;
          width: 100%;
          padding: 8px;
          overflow-x: auto;
        }

        .sec-nav-group {
          display: none;
        }

        .sec-nav-item {
          flex: none;
          padding: 6px 10px;
          border-left: 0;
          border-radius: 2px;
        }

        /* 窄屏下操作按钮保留为一行，避免只能看到导航却无法运行用例 */
        .sec-side-foot {
          display: flex;
          flex: 1 0 100%;
          gap: 8px;
          box-sizing: border-box;
          padding: 0 8px 8px;
        }

        .sec-side-foot > .layui-btn {
          flex: 1;
          margin: 0 !important;
          padding: 0 6px;
          font-size: 12px;
          white-space: nowrap;
        }

        /* 图标在此宽度下只占位不加信息，隐藏以让文案保持单行 */
        .sec-side-foot > .layui-btn > .layui-icon {
          display: none;
        }

        .sec-main {
          margin-left: 0;
        }

        /* 窄屏侧栏退化为顶部条，浮层改为整宽底部面板：
           仍为 fixed 定位，不改变页面高度 */
        .sec-pending {
          right: 8px;
          bottom: 8px;
          left: 8px;
          width: auto;
          max-width: none;
          max-height: 62vh;
        }

        .sec-pending-head {
          padding: 10px 12px 8px;
        }

        .sec-pending-item {
          padding: 6px 12px;
        }
      }
    </style>
  </head>
  <body>
    <aside class="sec-side">
      <div class="sec-side-head">
        <h1 class="sec-side-title">Layui 2.x</h1>
        <p class="sec-side-path">XSS 安全测试用例</p>
      </div>
      <nav class="sec-side-nav" id="sec-nav">
        <div class="sec-nav-group">受影响组件</div>
        <div id="sec-nav-list"></div>
      </nav>
      <div class="sec-side-foot">
        <button
          id="sec-run-all"
          type="button"
          class="layui-btn layui-btn-fluid"
          disabled
        >
          <i class="layui-icon layui-icon-play"></i> 运行自动用例 (<span
            id="sec-auto-count"
            >0</span
          >)
        </button>
        <button
          id="sec-pending-jump"
          type="button"
          class="layui-btn layui-btn-warm layui-btn-fluid"
          style="margin: 8px 0 0"
          aria-controls="sec-pending-panel"
          aria-expanded="false"
          disabled
        >
          <i class="layui-icon layui-icon-form"></i> 待运行用例 (<span
            id="sec-pending-count"
            >0</span
          >)
        </button>
        <button
          id="sec-reset"
          type="button"
          class="layui-btn layui-btn-primary layui-btn-fluid"
          style="margin: 8px 0 0"
          disabled
        >
          重置结果
        </button>
      </div>
    </aside>

    <main class="sec-main">
      <section class="sec-hero">
        <div>
          <h1>XSS 安全测试用例</h1>
          <p>

    <script src="../../src/layui.js"></script>
    <script>
      layui.use(
        ['table', 'transfer', 'tree', 'progress', 'layer', 'i18n', 'util'],
        function () {
          'use strict';

          var $ = layui.$;
          var table = layui.table;
          var transfer = layui.transfer;
          var tree = layui.tree;
          var progress = layui.progress;
          var layer = layui.layer;
          var lay = layui.lay;
          var i18n = layui.i18n;
          var util = layui.util;

          util.fixbar({
            on: {
              click: function (type) {
                if (type === 'top') {
                  location.hash = '';
                }
              }
            }
          });

          /**
           * 1. 载荷与断言
           */

          // 载荷执行标记：任何标记被写入，说明转义失效
          var MARK = (window.__layuiXssFired = []);

          var PAYLOAD = {
            // 文本节点注入
            text: '<img src=x onerror="window.__layuiXssFired.push(\'text\')">',
            // 双引号属性逃逸注入
            attr: '"><img src=x onerror="window.__layuiXssFired.push(\'attr\')">',
            // 单引号属性逃逸注入（部分属性使用单引号拼接）
            attrSingle:
              "'><img src=x onerror=\"window.__layuiXssFired.push('attr-s')\">",
            // URL scheme 注入
            jsHref: 'javascript:window.__layuiXssFired.push("href-js")',
            mixedCaseHref:
              'JaVaScRiPt:window.__layuiXssFired.push("href-case")',
            newlineHref: 'java\nscript:window.__layuiXssFired.push("href-nl")',
            tabHref: '\tjavascript:window.__layuiXssFired.push("href-tab")',
            dataHref: 'data:text/html,<b>data</b>',
            vbscriptHref: 'vbscript:msgbox("x")',
            // 分数形态的表达式注入（以 // 注释结尾以满足分数正则）
            evalExpr: "window.__layuiXssFired.push('eval')//"
          };

          /**
           * URL scheme 白名单向量
           * allowed 同时约定渲染结果：true 生成 <a href>，false 降级为 <span>
           */
          var HREF_VECTORS = [
            { title: '绝对 HTTPS', href: 'https://example.com', allowed: true },
            {
              title: '绝对 HTTPS 大写协议',
              href: 'HTTPS://example.com/docs',
              allowed: true
            },
            {
              title: '近似协议 httpx',
              href: 'httpx://example.com',
              allowed: false
            },
            {
              title: '绝对 HTTP',
              href: 'http://example.com/docs',
              allowed: true
            },
            {
              title: '相对目录',
              href: '../documents/report.pdf',
              allowed: true
            },
            { title: '无 scheme 的路径', href: 'example.com', allowed: true },
            {
              title: '内部含空格的相对地址',
              href: 'Meeting notes: 2026.pdf',
              allowed: true
            },
            {
              title: '内部含空格的绝对地址',
              href: 'https://example.com/Meeting notes.pdf',
              allowed: true
            },
            {
              title: '路径中含制表符的 HTTPS',
              href: 'https://example.com/a\tb',
              allowed: true
            },
            {
              title: '路径中含协议字样的 HTTPS',
              href: 'https://example.com/javascript:guide',
              allowed: true
            },
            {
              title: 'mailto',
              href: 'mailto:hello@example.com?subject=Hi',
              allowed: true
            },
            { title: 'tel', href: 'tel:+8613800000000', allowed: true },
            {
              title: 'mailto 大小写混淆',
              href: 'MAILTO:hello@example.com',
              allowed: true
            },
            { title: 'javascript', href: PAYLOAD.jsHref, allowed: false },
            {
              title: '大小写混淆',
              href: PAYLOAD.mixedCaseHref,
              allowed: false
            },
            { title: '换行混淆', href: PAYLOAD.newlineHref, allowed: false },
            { title: 'tab 前缀', href: PAYLOAD.tabHref, allowed: false },
            {
              title: '内部 tab 混淆',
              href: 'java\tscript:alert(1)',
              allowed: false
            },
            {
              title: '内部回车混淆',
              href: 'java\rscript:alert(1)',
              allowed: false
            },
            {
              title: '内部控制字符混淆',
              href: 'java\x0bscript:alert(1)',
              allowed: false
            },
            {
              title: '内部 DEL 混淆',
              href: 'java\x7fscript:alert(1)',
              allowed: false
            },
            {
              title: '空格 + tab 混合混淆',
              href: ' java\tscript:alert(1)',
              allowed: false
            },
            {
              title: '未授权的 FTP 协议',
              href: 'ftp://example.com/file',
              allowed: false
            },
            { title: 'data', href: PAYLOAD.dataHref, allowed: false },
            {
              title: 'data 无标签',
              href: 'data:text/html,test',
              allowed: false
            },
            { title: 'vbscript', href: PAYLOAD.vbscriptHref, allowed: false }
          ];

          function show(value) {
            return JSON.stringify(value);
          }

          /**
           * 断言集合：全部基于 DOM 只读查询，返回 { passed, detail }
           */
          var assert = {
            text: function (root, selector, expected) {
              var elem = root.querySelector(selector);
              var actual = elem ? elem.textContent.trim() : null;
              return {
                passed: actual === expected,
                detail:
                  selector +
                  ' 文本：期望 ' +
                  show(expected) +
                  '，实际 ' +
                  show(actual)
              };
            },
            attr: function (root, selector, name, expected) {
              var elem = root.querySelector(selector);
              var actual = elem ? elem.getAttribute(name) : null;
              return {
                passed: actual === expected,
                detail:
                  selector +
                  ' 的 ' +
                  name +
                  '：期望 ' +
                  show(expected) +
                  '，实际 ' +
                  show(actual)
              };
            },
            count: function (root, selector, expected) {
              var actual = root.querySelectorAll(selector).length;
              return {
                passed: actual === expected,
                detail:
                  selector + ' 数量：期望 ' + expected + '，实际 ' + actual
              };
            },
            none: function (root, selector) {
              var actual = root.querySelectorAll(selector).length;
              return {
                passed: actual === 0,
                detail: selector + ' 数量：期望 0，实际 ' + actual
              };
            },
            truthy: function (condition, message) {
              return { passed: !!condition, detail: message };
            }
          };

          /**
           * 聚合断言：任一失败则用例失败
           * 保留逐条明细，供卡片展开为可逐项核对的断言列表
           */
          function judge(results) {
            var passed = true;
            var items = [];

            layui.each(results, function (index, result) {
              if (!result.passed) passed = false;
              items.push({
                passed: !!result.passed,
                detail: result.detail || ''
              });
            });

            var details = [];
            layui.each(items, function (index, item) {
              if (item.detail) details.push(item.detail);
            });

            return {
              passed: passed,
              detail: details.join('；'),
              items: items
            };
          }

          /**
           * layer.photos 用例的公共资源与收尾助手
           * 相册浮层挂载在 body 下（id 固定为 layui-layer-photos），断言以浮层为根节点；
           * 浮层需在 run() 内打开、finally 内关闭，避免挂载期叠加多个同名浮层
           */

          // 合法 data URI 图片：可正常加载，用于让浮层进入渲染成功分支
          var SECURE_SVG =
            'data:image/svg+xml;base64,' +
            btoa(
              '<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"></svg>'
            );

          // 相对地址图片：无协议地址应被视为安全链接，用于验证查看原图链接保留。
          // 复用仓库既有的合法 SVG 文档（img 可正常加载），避免为测试新增资源文件
          var RELATIVE_SVG = '../../src/font/iconfont.svg';

          // 含引号与 & 的相对地址图片：静态服务对查询串返回同一图片，
          // 作为 src 属性转义的关键验证向量
          var QUOTED_URL =
            '../../src/font/iconfont.svg?a=1&b=" onmouseover="alert(1)';

          // 预热网络图片：挂载期先行预载进入内存缓存，使 run() 内
          // layer.photos 的 loadImage 可同步完成（缓存资源的 img.complete 为真）
          $.each([RELATIVE_SVG, QUOTED_URL], function () {
            new Image().src = this;
          });

          // 关闭当前相册浮层（含异常场景遗留的实例），避免用例间的浮层叠加影响后续断言。
          // layer.close 的容器移除受关闭动画影响存在延迟，需同步移除容器与遮罩，
          // 否则下个用例的同 id 弹层会复用"正在关闭中"的旧实例；
          // times 属性位于外层 .layui-layer 包装元素上，id 所在的内层节点本身不携带该属性
          function closePhotosViewer() {
            document
              .querySelectorAll('#layui-layer-photos')
              .forEach(function (el) {
                var wrapper = el.closest('.layui-layer');
                if (!wrapper) return;
                var times = Number(wrapper.getAttribute('times'));
                if (!times) return;
                layer.close(times);
                wrapper.remove();
                var shade = document.getElementById(
                  'layui-layer-shade' + times
                );
                if (shade) shade.remove();
              });
          }

          /**
           * 2. 用例注册表
           * ============================================================
           * 新增同类测试只需追加 module / case：
           * - module.id / title / icon / desc
           * - case.id / title / anchors / fixture（初始 HTML）
           * - case.setup(fixture, ctx)：fixture 已挂载到文档后再渲染组件
           * - case.run(fixture, ctx)：返回 judge([...]) 断言结果
           * - case.action：可选，{ title, handler } 手动触发交互用例
           */
          var registry = [
            {
              id: 'table',
              title: 'table 表格',
              icon: 'layui-icon-table',
              desc:
                '空数据与请求异常文案经由 <code>errorView</code> 渲染，' +
                'i18n 默认文案不应被二次编码。',
              cases: [
                {
                  id: 'error-view-text',
                  title: '空数据文案中的 HTML 按纯文本渲染',
                  anchors: ['table.js#errorView', 'options.text.none'],
                  fixture: '<table></table>',
                  setup: function (fx) {
                    table.render({

                      cols: [[{ field: 'username', title: '用户名' }]],

                  run: function (fx) {

                      assert.text(root, '.layui-none', PAYLOAD.text),

                },
                {
                  id: 'error-view-entity',
                  title: '文案中的实体与标签保持字面显示',
                  anchors: ['table.js#errorView'],
                  fixture: '<table></table>',
                  setup: function (fx) {
                    table.render({
                      elem: fx.find('table')[0],
                      cols: [[{ field: 'username', title: '用户名' }]],
                      data: [],
                      text: { none: '空态 A &amp; B <b>加粗</b>' }
                    });
                  },
                  run: function (fx) {
                    var root = fx[0];
                    return judge([
                      assert.text(
                        root,
                        '.layui-none',
                        '空态 A &amp; B <b>加粗</b>'

                      assert.none(root, '.layui-none b')

                    ]);
                  }
                },
                {

                  setup: function (fx) {
                    table.render({

                      cols: [[{ field: 'username', title: '用户名' }]],
                      ajax: function (options) {

                },
                {
                  id: 'xhr-error-i18n',
                  title: '请求异常文案中的 msg 不重复编码',

                {

                  title: '服务端合计值（totalRow）中的 HTML 按纯文本渲染',
                  anchors: ['table.js#renderTotal', 'response.totalRowName'],
                  fixture: '<table></table>',
                  setup: function (fx) {
                    table.render({
                      elem: fx.find('table')[0],
                      cols: [
                        [{ field: 'score', title: '分数', totalRow: true }]

            },
            {

                {

                  fixture: '<div></div>',
                  run: function (fx, ctx) {

          var runner = (function () {
            var modules = [];
            var navList = $('#sec-nav-list');
            var moduleMount = $('#sec-modules');
            // 「待运行用例」列表的内容签名，避免每次断言都重建 DOM
            var pendingSignature = null;

            function countByState(module) {
              var result = { total: module.cases.length, pass: 0, fail: 0 };
              layui.each(module.cases, function (index, useCase) {
                if (useCase.state === 'pass') result.pass += 1;
                if (useCase.state === 'fail') result.fail += 1;
              });
              return result;
            }

            // 每个模块在文档中的锚点 id，用于地址栏 hash 与刷新后定位
            function anchorId(module) {
              return 'module-' + module.id;
            }

            function findModuleByKey(key) {
              var found = null;
              layui.each(modules, function (index, module) {
                if (module.id === key || anchorId(module) === key)
                  found = module;
              });
              return found;
            }

            // 解析地址栏锚点：同时支持模块锚点与用例锚点
            function findHashTarget(hash) {
              var key = String(hash || '').replace(/^#/, '');
              if (!key) return null;

              var found = null;
              layui.each(modules, function (index, module) {
                if (module.id === key || anchorId(module) === key) {
                  found = { module: module };
                  return true;
                }
                layui.each(module.cases, function (caseIndex, useCase) {
                  if (key !== 'case-' + module.id + '-' + useCase.id) return;
                  found = { module: module, useCase: useCase };
                  return true;
                });
                if (found) return true;
              });
              return found;
            }

            function scrollToModule(module) {
              var target = document.getElementById(anchorId(module));
              if (!target) return;
              window.scrollTo(
                0,
                target.getBoundingClientRect().top + window.pageYOffset - 12
              );
            }

            function setActiveNav(module) {
              navList.find('.sec-nav-item').each(function () {
                var item = $(this);
                item.toggleClass(
                  'is-active',
                  item.attr('data-target') === module.id
                );
              });
            }

            // 激活模块：同步侧栏高亮 + 滚动定位 + 写入地址栏锚点
            function activateModule(module, options) {
              options = options || {};
              setActiveNav(module);
              scrollToModule(module);
              if (options.hash === false) return;
              var nextHash = '#' + anchorId(module);
              if (window.location.hash === nextHash) return;
              // 使用 replaceState：不产生额外历史记录，也不会触发浏览器的二次跳转
              try {
                window.history.replaceState(null, '', nextHash);
              } catch (err) {
                window.location.hash = anchorId(module);
              }
            }

            function renderNav() {
              var html = [];
              layui.each(modules, function (index, module) {
                html.push(
                  '<div class="sec-nav-item' +
                    (index === 0 ? ' is-active' : '') +
                    '" data-target="' +
                    module.id +
                    '" data-anchor="' +
                    anchorId(module) +
                    '">' +
                    '<i class="layui-icon ' +
                    module.icon +
                    '"></i>' +
                    '<span class="sec-nav-text">' +
                    module.title +
                    '</span>' +
                    '<span class="sec-nav-count" data-nav-count="' +
                    module.id +
                    '">0/' +
                    module.cases.length +
                    '</span>' +
                    '</div>'
                );
              });
              navList.html(html.join(''));
              navList.find('.sec-nav-item').on('click', function () {
                var module = findModuleByKey($(this).attr('data-target'));
                if (module) activateModule(module);
              });
              // 支持浏览器前进/后退或手动修改 hash
              $(window).on('hashchange', function () {
                var target = findHashTarget(window.location.hash);
                if (!target) return;
                if (target.useCase) {
                  focusCase(target.module, target.useCase);
                  return;
                }
                setActiveNav(target.module);
                scrollToModule(target.module);
              });
            }

            function renderModules() {
              layui.each(modules, function (index, module) {
                var section = $(
                  '<section class="sec-module" id="' +
                    anchorId(module) +
                    '">' +
                    '<div class="sec-module-head">' +
                    '<h2 class="sec-module-title">' +
                    '<i class="layui-icon ' +
                    module.icon +
                    '"></i>' +
                    module.title +
                    '</h2>' +
                    '<button type="button" class="layui-btn layui-btn-primary layui-btn-sm" data-run-module="' +
                    module.id +
                    '">运行本组自动用例</button>' +
                    '</div>' +
                    '<p class="sec-module-body">' +
                    module.desc +
                    '</p>' +
                    '<div class="sec-cases"></div>' +
                    '</section>'
                );
                var grid = section.find('.sec-cases');
                if (module.layout) grid.addClass('is-' + module.layout);

                layui.each(module.cases, function (caseIndex, useCase) {
                  useCase.manual = !!useCase.action;
                  var card = $(
                    '<article class="sec-case" id="case-' +
                      module.id +
                      '-' +
                      useCase.id +
                      '" data-case="' +
                      useCase.id +
                      '" data-state="pending">' +
                      '<div class="sec-case-head">' +
                      '<h3 class="sec-case-title">' +
                      '<span class="sec-case-idx">' +
                      (caseIndex + 1) +
                      '.</span>' +
                      '</h3>' +
                      (useCase.manual
                        ? '<span class="sec-case-tag">手工</span>'
                        : '') +
                      '<span class="sec-case-state">' +
                      stateText(useCase, 'pending') +
                      '</span>' +
                      '</div>' +
                      '<p class="sec-case-anchors">' +
                      useCase.anchors
                        .map(function (anchor) {
                          return '<code>' + anchor + '</code>';
                        })
                        .join('') +
                      '</p>' +
                      '<div class="sec-case-body"></div>' +
                      '<div class="sec-case-actions"></div>' +
                      '<div class="sec-case-detail" hidden></div>' +
                      '</article>'
                  );
                  // 用例标题按文本写入，避免自身引入注入
                  card
                    .find('.sec-case-title')
                    .append(document.createTextNode(useCase.title));
                  if (useCase.wide) card.addClass('is-wide');
                  if (useCase.manual) card.addClass('is-manual');
                  grid.append(card);
                  useCase.elem = card;
                  useCase.state = 'pending';
                  useCase.body = card.find('.sec-case-body');
                });

                module.elem = section;
                moduleMount.append(section);
              });
            }

            function createFixture(useCase, options) {
              options = options || {};
              var fixture = $(
                '<div class="sec-fixture">' + (options.html || '') + '</div>'
              );
              useCase.body.append(fixture);
              return fixture;
            }

            function mountFixtures() {
              layui.each(modules, function (index, module) {
                layui.each(module.cases, function (caseIndex, useCase) {
                  useCase.ctx = {
                    // 首次调用时创建并缓存额外 fixture，避免重复运行叠加节点
                    fixtureOnce: function (key) {
                      useCase.extra = useCase.extra || {};
                      if (!useCase.extra[key]) {
                        useCase.extra[key] = createFixture(useCase, {
                          html: useCase.fixture || '<div></div>'
                        });
                      }
                      return useCase.extra[key];
                    },
                    caseState: {}
                  };
                  useCase.fixtureElem = createFixture(useCase, {
                    html: useCase.fixture || '<div></div>'
                  });

                  if (useCase.setup) {
                    useCase.setup(useCase.fixtureElem, useCase.ctx);
                  }

                  if (useCase.action) {
                    var actions = useCase.elem.find('.sec-case-actions');
                    var actionButton = $(
                      '<button type="button" class="layui-btn layui-btn-primary layui-btn-sm"></button>'
                    );
                    actionButton
                      .text(useCase.action.title)
                      .on('click', function () {
                        var button = $(this);
                        try {
                          useCase.action.handler(
                            useCase.fixtureElem,
                            useCase.ctx
                          );
                        } catch (err) {
                          setResult(useCase, {
                            passed: false,
                            detail: '交互触发异常：' + err.message
                          });
                          button.prop('disabled', true);
                          return;
                        }
                        setResult(useCase, execute(useCase));
                        button.prop('disabled', true);
                      });
                    actions.append(actionButton);
                  }
                });
              });
            }

            function execute(useCase) {
              var result;
              try {
                result = useCase.run(useCase.fixtureElem, useCase.ctx);
              } catch (err) {
                result = {
                  passed: false,
                  detail: '断言执行异常：' + (err && err.message)
                };
              }
              if (!result || typeof result.passed !== 'boolean') {
                result = {
                  passed: false,
                  detail: '用例未返回有效断言结果'
                };
              }
              return result;
            }

            function stateText(useCase, state) {
              if (state === 'pass') return '通过';
              if (state === 'fail') return '失败';
              return useCase.manual ? '待手工' : '待运行';
            }

            /**
             * 渲染断言明细：逐条列出通过与失败的断言，失败项高亮
             */
            function renderDetail(useCase, result) {
              var detail = useCase.elem.find('.sec-case-detail');

              if (!result) {
                detail.prop('hidden', true).empty();
                return;
              }

              var items =
                result.items && result.items.length
                  ? result.items
                  : [{ passed: !!result.passed, detail: result.detail || '' }];
              var failedCount = 0;

              layui.each(items, function (index, item) {
                if (!item.passed) failedCount += 1;
              });

              var html = [
                '<div class="sec-detail-head">',
                '<i class="layui-icon ' +
                  (failedCount
                    ? 'layui-icon-close-fill'
                    : 'layui-icon-ok-circle') +
                  '"></i>',
                '<span class="sec-detail-title">断言明细</span>',
                '<em class="sec-detail-badge' +
                  (failedCount ? ' is-fail' : '') +
                  '">通过 ' +
                  (items.length - failedCount) +
                  '</em>',
                failedCount
                  ? '<em class="sec-detail-badge is-fail">失败 ' +
                    failedCount +
                    '</em>'
                  : '',
                '</div>',
                '<ul class="sec-asserts">'
              ];

              layui.each(items, function (index, item) {
                html.push(
                  '<li class="' +
                    (item.passed ? 'is-pass' : 'is-fail') +
                    '">' +
                    '<i class="layui-icon ' +
                    (item.passed ? 'layui-icon-ok' : 'layui-icon-close') +
                    '"></i>' +
                    '<span></span>' +
                    '</li>'
                );
              });

              html.push('</ul>');

              detail.html(html.join('')).prop('hidden', false);

              // 断言文案包含载荷原文，按文本写入，避免明细自身引入注入
              var textNodes = detail.find('.sec-asserts li span');
              layui.each(items, function (index, item) {
                $(textNodes[index]).text(item.detail || '');
              });
            }

            function setResult(useCase, result) {
              useCase.state = result
                ? result.passed
                  ? 'pass'
                  : 'fail'
                : 'pending';
              useCase.lastDetail = result ? result.detail : '';
              useCase.elem.attr('data-state', useCase.state);
              useCase.elem
                .find('.sec-case-state')
                .text(stateText(useCase, useCase.state));
              renderDetail(useCase, result);
              updateSummary();
            }

            function updateSummary() {
              var total = 0;
              var pass = 0;
              var fail = 0;

              layui.each(modules, function (index, module) {
                var stat = countByState(module);
                total += stat.total;
                pass += stat.pass;
                fail += stat.fail;

                var navCount = $('[data-nav-count="' + module.id + '"]');
                navCount.text(stat.pass + '/' + stat.total);
                navCount
                  .toggleClass('is-pass', stat.pass === stat.total)
                  .toggleClass('is-fail', stat.fail > 0);
              });

              $('#sec-total').text(total);
              $('#sec-pass').text(pass);
              $('#sec-fail').text(fail);
              $('#sec-pending').text(total - pass - fail);

              var percent = total ? Math.round((pass / total) * 100) : 0;
              var bar = $('#sec-progress');
              bar.toggleClass('is-fail', fail > 0);
              bar.find('i').css('width', percent + '%');

              renderPending();
            }

            // 全部未执行的用例（含手工用例），用于「待运行用例」面板
            function pendingCases() {
              var result = [];
              layui.each(modules, function (index, module) {
                layui.each(module.cases, function (caseIndex, useCase) {
                  if (useCase.state !== 'pending') return;
                  result.push({ module: module, useCase: useCase });
                });
              });
              return result;
            }

            // 自动用例数量：「运行自动用例」按钮文案
            function countAutoCases() {
              var count = 0;
              layui.each(modules, function (index, module) {
                layui.each(module.cases, function (caseIndex, useCase) {
                  if (!useCase.manual) count += 1;
                });
              });
              return count;
            }

            function renderPending() {
              var list = pendingCases();
              var manual = 0;
              var auto = 0;
              var signature = [];

              layui.each(list, function (index, entry) {
                if (entry.useCase.manual) manual += 1;
                else auto += 1;
                signature.push(entry.module.id + '/' + entry.useCase.id);
              });

              $('#sec-pending-count').text(list.length);
              $('#sec-auto-count').text(countAutoCases());
              $('#sec-manual-hint').text(manual ? '其中手工 ' + manual : '');
              $('#sec-pending-summary').text(
                list.length
                  ? '共 ' +
                      list.length +
                      ' 项未执行（手工 ' +
                      manual +
                      '、自动 ' +
                      auto +
                      '），点击可定位并高亮对应卡片'
                  : '全部用例均已执行'
              );
              $('#sec-pending-jump')
                .toggleClass('layui-btn-warm', list.length > 0)
                .toggleClass('layui-btn-primary', list.length === 0);

              var nextSignature = signature.join('|');
              if (nextSignature === pendingSignature) return;
              pendingSignature = nextSignature;

              var panelList = $('#sec-pending-list');
              panelList.empty();

              layui.each(list, function (index, entry) {
                var item = $(
                  '<li><button type="button" class="sec-pending-item">' +
                    '<span class="sec-pending-item-module"></span>' +
                    '<span class="sec-pending-item-case"></span>' +
                    '<em class="sec-pending-flag ' +
                    (entry.useCase.manual ? 'is-manual' : 'is-auto') +
                    '">' +
                    (entry.useCase.manual ? '手工' : '自动') +
                    '</em>' +
                    '</button></li>'
                );
                item.find('.sec-pending-item-module').text(entry.module.title);
                item.find('.sec-pending-item-case').text(entry.useCase.title);
                item.find('.sec-pending-item').on('click', function () {
                  focusCase(entry.module, entry.useCase);
                  // 浮层会遮挡目标卡片，跳转后统一收起（浮层仅作导航入口）
                  setPendingVisible(false);
                });
                panelList.append(item);
              });

              $('#sec-pending-empty').prop('hidden', list.length > 0);
            }

            /**
             * 展开/收起待运行浮层
             * 浮层为 fixed 定位、不参与文档流，因此这里不滚动页面：
             * 任何滚动都只应由用户点击具体用例（focusCase）触发
             */
            /**
             * 浮层定位：右缘对齐侧栏右边界，底边对齐「待运行用例」按钮
             * 与侧栏 nav 列表完全错开（侧栏宽度之外），窄屏则由 CSS 接管为底部面板
             */
            function positionPending() {
              var panel = $('#sec-pending-panel');
              if (panel.prop('hidden')) return;

              var isNarrow = window.matchMedia('(max-width: 720px)').matches;
              var elem = panel[0];

              // 窄屏由 CSS 的 left/right 控制，清掉内联样式即可
              elem.style.left = '';
              elem.style.bottom = '';

              if (isNarrow) return;

              var side = document
                .querySelector('.sec-side')
                .getBoundingClientRect();
              var jump = document
                .getElementById('sec-pending-jump')
                .getBoundingClientRect();

              elem.style.left = Math.round(side.right) + 'px';
              elem.style.bottom =
                Math.max(8, Math.round(window.innerHeight - jump.bottom)) +
                'px';

              // 右边界兜底：避免超宽时溢出视口
              var rect = elem.getBoundingClientRect();
              var overflow = rect.right - (window.innerWidth - 8);
              if (overflow > 0) {
                elem.style.left =
                  Math.max(8, Math.round(rect.left - overflow)) + 'px';
              }
            }

            /**
             * 展开/收起待运行浮层
             * 浮层为 fixed 定位、不参与文档流，因此不改变页面高度、也不滚动页面：
             * 任何滚动都只应由用户点击具体用例（focusCase）触发
             */
            function setPendingVisible(visible) {
              var panel = $('#sec-pending-panel');
              panel.prop('hidden', !visible);
              $('#sec-pending-jump').attr(
                'aria-expanded',
                visible ? 'true' : 'false'
              );
              if (!visible) return;

              renderPending();
              positionPending();

              // 展开后把焦点交给第一个条目，便于纯键盘操作；
              // preventScroll 避免聚焦动作触发视口滚动
              var first = panel.find('.sec-pending-item')[0];
              if (first && first.focus) first.focus({ preventScroll: true });
            }

            // 定位用例卡片：滚动到可视区并高亮，同时同步地址栏锚点
            function focusCase(module, useCase, options) {
              options = options || {};
              setActiveNav(module);

              var target = document.getElementById(
                'case-' + module.id + '-' + useCase.id
              );
              if (!target) return;

              window.scrollTo(
                0,
                target.getBoundingClientRect().top + window.pageYOffset - 16
              );

              // 移除后强制重排，保证连续定位同一用例时动画可重放
              target.classList.remove('is-flash');
              void target.offsetWidth;
              target.classList.add('is-flash');
              window.clearTimeout(useCase.flashTimer);
              useCase.flashTimer = window.setTimeout(function () {
                target.classList.remove('is-flash');
              }, 1600);

              if (options.hash === false) return;
              try {
                window.history.replaceState(
                  null,
                  '',
                  '#case-' + module.id + '-' + useCase.id
                );
              } catch (err) {
                /* 忽略：部分环境不允许改写地址栏 */
              }
            }

            // 按地址栏锚点定位：用例锚点高亮卡片，模块锚点仅滚动到分组
            function restoreFromHash(options) {
              var target = findHashTarget(window.location.hash);
              if (!target) return false;

              if (target.useCase) {
                focusCase(target.module, target.useCase, options);
                return true;
              }

              setActiveNav(target.module);
              scrollToModule(target.module);
              return true;
            }

            /**
             * 首次进入时组件渲染会改变页面高度（表格、穿梭框异步布局），
             * 单次滚动可能落点偏移，因此在 load 完成后补一次定位
             */
            function restoreFromHashAfterLoad() {
              restoreFromHash({ hash: false });
              $(window).one('load', function () {
                restoreFromHash({ hash: false });
              });
              // load 可能已经触发，兜底再校准一次
              window.setTimeout(function () {
                restoreFromHash({ hash: false });
              }, 0);
            }

            function notify(text, hasFail) {
              var status = $('#sec-run-status');
              status.text(text).toggleClass('is-fail', !!hasFail);
            }

            /**
             * 批量执行时保持阅读位置
             * 断言明细会就地撑高卡片，浏览器滚动锚定只能近似补偿，
             * 仍会造成视口内容跳动。这里在批处理前后对齐「视口顶部最近的用例卡片」
             * 的屏幕位置，使滚动条与当前阅读内容都保持不动。
             */
            function captureViewportAnchor() {
              var top = null;

              layui.each(modules, function (index, module) {
                if (top) return true;
                layui.each(module.cases, function (caseIndex, useCase) {
                  var rect = useCase.elem[0].getBoundingClientRect();
                  if (rect.bottom <= 0) return;
                  top = { elem: useCase.elem[0], offset: rect.top };
                  return true;
                });
                if (top) return true;
              });

              return top;
            }

            function restoreViewportAnchor(anchor) {
              if (!anchor || !anchor.elem) return;
              var delta =
                anchor.elem.getBoundingClientRect().top - anchor.offset;
              if (Math.abs(delta) < 1) return;
              window.scrollBy(0, delta);
            }

            function runCase(useCase) {
              setResult(useCase, execute(useCase));
              return useCase.state;
            }

            // 自动用例指不依赖真实交互、可一次性断言的用例；
            // 手工用例需点击卡片按钮触发交互，未触发前保持待手工
            function runAutoCases(filter, options) {
              options = options || {};
              var scopeTotal = 0;
              var scopePass = 0;
              var scopeFail = 0;
              var anchor = captureViewportAnchor();

              layui.each(modules, function (index, module) {
                if (filter && filter(module) === false) return;
                layui.each(module.cases, function (caseIndex, useCase) {
                  if (useCase.manual) return;
                  scopeTotal += 1;
                  var state = runCase(useCase);
                  if (state === 'pass') scopePass += 1;
                  else scopeFail += 1;
                });
              });

              var manualPending = 0;
              layui.each(pendingCases(), function (index, entry) {
                if (entry.useCase.manual) manualPending += 1;
              });

              // 全局运行时展开待办面板；单组运行不打断当前定位
              if (manualPending && options.openPending) setPendingVisible(true);

              notify(
                '自动用例执行完成：共 ' +
                  scopeTotal +
                  ' 项，通过 ' +
                  scopePass +
                  '、失败 ' +
                  scopeFail +
                  (manualPending
                    ? '；另有 ' + manualPending + ' 项待手工触发'
                    : ''),
                scopeFail > 0
              );

              // 最后一并校正视口：上面的状态条、浮层文案也会改变布局
              restoreViewportAnchor(anchor);

              return summary();
            }

            function runAll() {
              return runAutoCases(null, { openPending: true });
            }

            function runModule(moduleId) {
              return runAutoCases(function (module) {
                return module.id === moduleId;
              });
            }

            function reset() {
              MARK.length = 0;
              layui.each(modules, function (index, module) {
                layui.each(module.cases, function (caseIndex, useCase) {
                  setResult(useCase, null);
                  useCase.elem
                    .find('.sec-case-actions button')
                    .prop('disabled', false);
                });
              });
              notify('');
              return summary();
            }

            function summary() {
              var models = [];
              var total = 0;
              var pass = 0;
              var fail = 0;
              layui.each(modules, function (index, module) {
                layui.each(module.cases, function (caseIndex, useCase) {
                  total += 1;
                  if (useCase.state === 'pass') pass += 1;
                  if (useCase.state === 'fail') fail += 1;
                  models.push({
                    id: module.id + '/' + useCase.id,
                    title: useCase.title,
                    state: useCase.state,
                    manual: !!useCase.manual,
                    detail: useCase.lastDetail || ''
                  });
                });
              });
              return {
                total: total,
                pass: pass,
                fail: fail,
                pending: total - pass - fail,
                markFired: MARK.slice(),
                cases: models
              };
            }

            function init() {
              layui.each(registry, function (index, definition) {
                modules.push({
                  id: definition.id,
                  title: definition.title,
                  icon: definition.icon,
                  layout: definition.layout,
                  desc: definition.desc,
                  cases: definition.cases.slice()
                });
              });

              renderNav();
              moduleMount.empty();
              renderModules();
              mountFixtures();
              updateSummary();

              $('#sec-run-all').prop('disabled', false).on('click', runAll);
              $('#sec-reset').prop('disabled', false).on('click', reset);
              $('#sec-pending-jump')
                .prop('disabled', false)
                .on('click', function () {
                  setPendingVisible($('#sec-pending-panel').prop('hidden'));
                });
              $('#sec-pending-close').on('click', function () {
                setPendingVisible(false);
              });
              // ESC 关闭浮层：浮层是辅助导航，不应打断主流程
              $(document).on('keydown', function (event) {
                if (event.key !== 'Escape' && event.keyCode !== 27) return;
                if ($('#sec-pending-panel').prop('hidden')) return;
                setPendingVisible(false);
              });
              // 点击浮层外部关闭，避免浮层长期遮挡内容
              $(document).on('mousedown', function (event) {
                if ($('#sec-pending-panel').prop('hidden')) return;
                var target = $(event.target);
                if (target.closest('#sec-pending-panel').length) return;
                if (target.closest('#sec-pending-jump').length) return;
                setPendingVisible(false);
              });
              moduleMount.find('[data-run-module]').on('click', function () {
                runModule($(this).attr('data-run-module'));
              });

              // 视口尺寸变化后重新对齐浮层（fixed 定位不受滚动影响，无需监听 scroll）
              $(window).on('resize', positionPending);

              // 刷新/直达带锚点的地址时，定位到对应模块或用例
              restoreFromHashAfterLoad();
            }

            return {
              init: init,
              runAll: runAll,
              runModule: runModule,
              reset: reset,
              summary: summary,
              pending: pendingCases,
              focus: function (id) {
                var parts = String(id || '').split('/');
                var target = null;

                if (!parts[0] || !parts[1]) return false;
